<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9f9f9; /* Light red background for error indication */
            font-family: Arial, sans-serif;
        }

        .error-message {
            text-align: center;
            background-color: #ffffff;
            padding: 20px 40px;
            border: 1px solid #f5c2c7; /* Light red border */
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            color: #842029; /* Dark red text color */
        }
    </style>
</head>
<body>
    <div class="error-message">
        <h1>Your key has been expired!</h1>
    </div>
</body>
</html>
